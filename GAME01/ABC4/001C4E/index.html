<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="stylesheet" href="css/style.css" />
    <title>gb</title>
    <base href="/GAME01/ABC4/001C4E/" />
    <!--
      ROM: Rick Roll for Game Boy by Alistair Hathaway
      https://allyhathaway.itch.io/rr-gb
      Emulator: binjgb, MIT license. See README.md.
    -->
    <style>
      #tap {
        position: fixed;
        inset: 0;
        z-index: 3;
        margin: 0;
        padding: 1.5rem;
        border: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f380f;
        color: #9bbc0f;
        font: 600 1.4rem/1.3 system-ui, sans-serif;
        text-align: center;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <button id="tap" type="button">Tap to start</button>
    <div id="game">
      <canvas id="mainCanvas" width="256" height="224">No Canvas Support</canvas>
    </div>
    <div id="controller">
      <div id="controller_dpad">
        <div id="controller_left"></div>
        <div id="controller_right"></div>
        <div id="controller_up"></div>
        <div id="controller_down"></div>
      </div>
      <div id="controller_select" class="capsuleBtn">Select</div>
      <div id="controller_start" class="capsuleBtn">Start</div>
      <div id="controller_b" class="roundBtn">B</div>
      <div id="controller_a" class="roundBtn">A</div>
    </div>
    <script>
      const customControls = {}
    </script>
    <script src="binjgb.js"></script>
    <script src="js/script.js"></script>
    <script>
      document.getElementById("tap").addEventListener("click", function () {
        this.remove();
        window.startCartridge();
      }, { once: true });
    </script>
  </body>
</html>
